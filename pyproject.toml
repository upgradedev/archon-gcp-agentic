[project]
name = "archon-gcp-agentic"
version = "0.1.0"
description = "An agent that closes a small haulier's month unattended."
requires-python = ">=3.11"
license = { text = "MIT" }

# Declared here as well as in requirements.txt, and the two are asserted
# identical by a test rather than kept in step by memory.
#
# This list being ABSENT is what broke the platform deploy: a
# `[project]` table makes this file the dependency manifest, an absent
# `dependencies` array reads as "this package needs nothing", and
# requirements.txt is then never consulted. The build reports success
# because there was nothing to install, and the function dies on its
# first third-party import with ModuleNotFoundError: fastapi.
dependencies = [
    "google-adk>=2.3,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "google-cloud-firestore>=2.19,<2.29",
    "google-api-core<2.35",
    "google-auth>=2.35,<3",
    "google-cloud-storage>=2.18,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ── Vercel ───────────────────────────────────────────────────────────────────
#
# Vercel auto-detects a FastAPI `app` only at the repository root, in `src/` or
# in `app/`, under one of six filenames. This package lives at
# `src/archon/adapters/service.py`, which matches none of them, so the
# entrypoint is named explicitly. It points at the shim in `service/main.py`,
# which puts `src` on the path and re-exports the SAME app object the container
# serves. There is no second application; a test asserts the identity.
[tool.vercel]
entrypoint = "service.main:app"

# `app.mount("/static", StaticFiles(directory=WEB_ROOT))` makes Vercel promote
# `web/` to the CDN and, by default, DROP it from the function bundle. That
# would be silently half-broken here: `/static/*` would serve from the CDN
# while `GET /` returns 500, because the index route reads
# `WEB_ROOT / "index.html"` off disk at request time rather than being a mount.
# Keeping the directory in the bundle costs a few kilobytes and removes the
# failure entirely.
[tool.vercel.fastapi.static]
exclude = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "default",
    # ADK 2.3 deprecates SequentialAgent for a graph Workflow whose LlmAgent
    # adapter is still private. Kept visible, never silenced: see the README.
]

[tool.ruff]
line-length = 100
target-version = "py311"
# readiness.py is a shared submission-kit component, kept Python 3.9 compatible
# and standard library only so it can run in any repo with no install step.
# Reformatting its percent-formatting to this repo's target would fork it from
# the copy every other entry uses, which costs more than the lint is worth.
# The video pipeline and readiness.py are shared submission-kit components,
# copied rather than rebuilt and kept byte-identical to the copy every other
# entry uses. Reformatting them to this repo's lint target forks them, which
# costs more than the lint is worth.
extend-exclude = [
    "scripts/readiness.py",
    "scripts/verify_video_sync.py",
    "video/",
    "tests/video/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# B008: FastAPI's dependency defaults are call-in-default by design.
# UP042: every enum here inherits `str, Enum` rather than `StrEnum` so that a
#   member interpolates and serialises as its own value everywhere, including
#   the Firestore documents and the JSON the browser renders. Switching would
#   change `f"{doc_type}"` under our feet for no gain.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["src/archon"]
omit = ["src/archon/cli.py"]
