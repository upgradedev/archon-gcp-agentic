# C4: SAST and DAST. The two halves, and neither is a passive baseline.
#
# CodeQL reads the source. The ZAP scan drives the running container and
# exercises the primary POST endpoint, because a passive baseline that only
# crawls GET routes proves nothing about the route that actually does work.
#
# Kept apart from ci.yml so a CodeQL queue backlog cannot make the build badge
# lie about the build, and so this can run on a schedule as well as on push.

name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a CVE published after the last commit still gets found.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v4.31.2
        with:
          languages: python
          # security-extended goes beyond the default query pack. This is an
          # agent that reads documents and writes to a database, so the extra
          # taint queries are the point.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v4.31.2

  dast:
    name: DAST against the running container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and start the image a judge would hit
        run: |
          docker build -t archon:dast .
          docker run -d --name archon -p 8080:8080 archon:dast
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/health

      # The active scan. `-a` includes the alpha rules; the OpenAPI import is
      # what makes it exercise POST /api/close/{period} rather than only
      # crawling the GET routes.
      - name: ZAP full scan
        uses: zaproxy/action-full-scan@75ee1686750ab1511a73b26b77a2aedd295053ed # v0.12.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: >-
            -a
            -j
            -z "-config replacer.full_list(0).description=openapi
                -config spider.maxDuration=3"
          allow_issue_writing: false
          fail_action: true

      - name: What the scan actually exercised
        if: always()
        run: |
          echo "Routes the scan must have touched, or it proved nothing:"
          docker logs archon 2>&1 | grep -oE '"(GET|POST) [^ ]+' | sort | uniq -c | sort -rn
          docker logs archon 2>&1 | grep -q 'POST /api/close' \
            || { echo "DAST never exercised the primary POST endpoint"; exit 1; }

      - name: Stop the container
        if: always()
        run: docker rm -f archon || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
          if-no-files-found: warn
