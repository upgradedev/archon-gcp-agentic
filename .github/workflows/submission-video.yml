# Copied from upgradedev/archon-datahub, master a1feb16,
# .github/workflows/submission-video.yml. Pristine copy at
# video/upstream/archon-datahub/submission-video.yml.
#
# Every line the kit changed, and every line a new project must change, is marked
# "KIT:". Grep for it before the first dispatch, and read the table in the kit README.
name: Generate exact-release submission video

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed SHA to record
        required: true
        type: string
      # KIT: these two bound the video to two DataHub-specific proof workflows. They are
      # optional now. Leave them empty if the project has no equivalent, or point them at
      # your own proof runs and edit the two workflow paths asserted below.
      hosted_run_id:
        description: Successful hosted-demo run for the release, optional
        required: false
        type: string
      governed_run_id:
        description: Successful write and rollback proof run for the release, optional
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: submission-video-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  video:
    name: Capture, compose and verify the judge video
    permissions:
      actions: read
      contents: read
      id-token: write
    # KIT: set the repository and the default branch. While this is unedited the job is
    # SKIPPED, which produces no video and no error, so fix it first.
    if: github.repository == 'upgradedev/<REPO>' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARCHON_RELEASE_SHA: ${{ inputs.release_sha }}
      ARCHON_HOSTED_RUN_ID: ${{ inputs.hosted_run_id }}
      ARCHON_GOVERNED_RUN_ID: ${{ inputs.governed_run_id }}
    steps:
      - name: Bind media to successful exact-release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${ARCHON_RELEASE_SHA}"
          [[ "${ARCHON_RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          # KIT: the run-id bindings run only when the ids are supplied. The two asserted
          # workflow paths are DataHub's; change them to your own proof workflows.
          if [[ -n "${ARCHON_HOSTED_RUN_ID}" ]]; then
            [[ "${ARCHON_HOSTED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_HOSTED_RUN_ID}" --jq .head_sha)" = "${ARCHON_RELEASE_SHA}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_HOSTED_RUN_ID}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_HOSTED_RUN_ID}" --jq .path)" = ".github/workflows/hosted-demo.yml"
          fi
          if [[ -n "${ARCHON_GOVERNED_RUN_ID}" ]]; then
            [[ "${ARCHON_GOVERNED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_GOVERNED_RUN_ID}" --jq .head_sha)" = "${ARCHON_RELEASE_SHA}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_GOVERNED_RUN_ID}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_GOVERNED_RUN_ID}" --jq .path)" = ".github/workflows/live-governed-proof.yml"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create one runner-temp media root
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/archon-submission-video"
          test ! -e "${root}"
          mkdir -m 0700 "${root}"
          echo "ARCHON_VIDEO_ROOT=${root}" >>"${GITHUB_ENV}"
      # KIT: these two steps exist only for the Google Cloud TTS provider and are skipped
      # unless the repository variable is set. With provider "elevenlabs" in
      # video/narration.json, delete them and set the ELEVENLABS_API_KEY secret instead.
      - if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_VIDEO_SERVICE_ACCOUNT }}
      - if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          # KIT: your Google Cloud project, if you use the Google provider.
          project_id: upgradegr-challenges
      - name: Install ephemeral media tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          echo "FFMPEG=$(command -v ffmpeg)" >>"${GITHUB_ENV}"
          echo "FFPROBE=$(command -v ffprobe)" >>"${GITHUB_ENV}"
      - name: Generate measured narration and captions
        # KIT: the ElevenLabs key. Set this repository secret, or delete the env block if
        # you narrate with the Google provider. The script also accepts XI_API_KEY and
        # ELEVEN_LABS_KEY, which older repositories here use.
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 video/generate-narration.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact browser dependencies
        run: npm ci --prefix web --ignore-scripts
      - name: Install ephemeral Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Record the real production journey
        working-directory: web
        run: node video/capture-production.mjs
      - name: Compose and independently probe the final media
        run: python3 video/build-video.py
      - name: Validate the upload package
        run: |
          set -euo pipefail
          output="${ARCHON_VIDEO_ROOT}/output"
          # KIT: this filename is set in video/build-video.py. Change both together.
          mp4="archon-datahub-demo.mp4"
          test -s "${output}/${mp4}"
          test -s "${output}/captions.en.srt"
          # KIT: sceneCount must equal the number of segments in video/narration.json.
          # The shipped template has 7. Change this literal when you change the beats.
          jq -e \
            --arg sha "${ARCHON_RELEASE_SHA}" \
            '.schemaVersion == "archon.submission-video-receipt/v1"
             and .releaseSha == $sha
             and .durationSeconds >= 90
             and .durationSeconds < 179
             and .width == 1920
             and .height == 1080
             and .sceneCount == 7
             and (.sha256 | test("^[a-f0-9]{64}$"))
             and .bytes > 1000000' \
            "${output}/video-receipt.json" >/dev/null
          if [[ -n "${ARCHON_HOSTED_RUN_ID}" ]]; then
            jq -e --argjson hosted "${ARCHON_HOSTED_RUN_ID}" '.hostedRunId == $hosted' \
              "${output}/video-receipt.json" >/dev/null
          fi
          if [[ -n "${ARCHON_GOVERNED_RUN_ID}" ]]; then
            jq -e --argjson governed "${ARCHON_GOVERNED_RUN_ID}" '.governedRunId == $governed' \
              "${output}/video-receipt.json" >/dev/null
          fi
          test "$(sha256sum "${output}/${mp4}" | awk '{print $1}')" = \
            "$(jq -er .sha256 "${output}/video-receipt.json")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # KIT: rename to your project.
          name: archon-datahub-submission-video-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/archon-submission-video/output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove runner media
        if: always()
        run: |
          set -euo pipefail
          test "${ARCHON_VIDEO_ROOT}" = "${RUNNER_TEMP}/archon-submission-video"
          rm -rf -- "${ARCHON_VIDEO_ROOT}"
      - name: Remove the runner-only Google credential before source verification
        if: always()
        run: |
          set -euo pipefail
          case "${GOOGLE_GHA_CREDS_PATH:-}" in
            "${GITHUB_WORKSPACE}"/gha-creds-*.json)
              rm -f -- "${GOOGLE_GHA_CREDS_PATH}"
              ;;
            "") ;;
            *)
              echo "::error::Unexpected Google credential path"
              exit 1
              ;;
          esac
      - name: Require a clean source checkout
        if: always()
        run: test -z "$(git status --porcelain)"
