# Copied from the submission kit,
# .github/workflows/submission-video.yml. Pristine copy at
# the submission kit's pristine copy.
#
# Every line the kit changed, and every line a new project must change, is marked
# Every kit placeholder in this file has been replaced with this entry's own
# values. The capture, the beats and the container it records are ours.
name: Generate exact-release submission video

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed SHA to record
        required: true
        type: string
      # Optional, and worth setting: they bind the recorded commit to a green CI run and a
      # optional now. Leave them empty if the project has no equivalent, or point them at
      # green Security run at the same SHA, so a cut cannot be made from a failing build.
      hosted_run_id:
        description: Successful hosted-demo run for the release, optional
        required: false
        type: string
      governed_run_id:
        description: Successful write and rollback proof run for the release, optional
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: submission-video-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  video:
    name: Capture, compose and verify the judge video
    permissions:
      actions: read
      contents: read
      id-token: write
    # A fork dispatching this would render on someone else's key and upload an
    # artifact naming this entry, so the job only runs here, on the trunk.
    if: github.repository == 'upgradedev/archon-gcp-agentic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARCHON_RELEASE_SHA: ${{ inputs.release_sha }}
      ARCHON_APP_URL: https://archon-70489367760.us-central1.run.app/
      ARCHON_HOSTED_RUN_ID: ${{ inputs.hosted_run_id }}
      ARCHON_GOVERNED_RUN_ID: ${{ inputs.governed_run_id }}
    steps:
      - name: Bind media to successful exact-release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${ARCHON_RELEASE_SHA}"
          [[ "${ARCHON_RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          # The run-id bindings run only when the ids are supplied. The two asserted
          # ci.yml is the build and test run; security.yml is CodeQL and the DAST.
          if [[ -n "${ARCHON_HOSTED_RUN_ID}" ]]; then
            [[ "${ARCHON_HOSTED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_HOSTED_RUN_ID}" --jq .head_sha)" = "${ARCHON_RELEASE_SHA}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_HOSTED_RUN_ID}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_HOSTED_RUN_ID}" --jq .path)" = ".github/workflows/ci.yml"
          fi
          if [[ -n "${ARCHON_GOVERNED_RUN_ID}" ]]; then
            [[ "${ARCHON_GOVERNED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_GOVERNED_RUN_ID}" --jq .head_sha)" = "${ARCHON_RELEASE_SHA}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_GOVERNED_RUN_ID}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARCHON_GOVERNED_RUN_ID}" --jq .path)" = ".github/workflows/security.yml"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create one runner-temp media root
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/archon-submission-video"
          test ! -e "${root}"
          mkdir -m 0700 "${root}"
          echo "ARCHON_VIDEO_ROOT=${root}" >>"${GITHUB_ENV}"
      # The narration provider is ElevenLabs, pinned in video/narration.json,
      # so the kit's optional Google text-to-speech branch is not carried here.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ephemeral media tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          echo "FFMPEG=$(command -v ffmpeg)" >>"${GITHUB_ENV}"
          echo "FFPROBE=$(command -v ffprobe)" >>"${GITHUB_ENV}"
      - name: Generate measured narration and captions
        # The one thing this workflow needs that no commit can supply: the owner
        # mirrors their ELEVENLABS_API_KEY as a repository secret. Until then
        # this step fails loudly rather than rendering silence, which is the
        # right failure: a video with no voice would still upload.
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 video/generate-narration.py
      # The capture is Python, like the tests it borrows its choreography from.
      # The kit's version was a .mjs needing npm and a lockfile in a repository
      # with no JavaScript toolchain at all.
      - name: Install the browser
        run: |
          set -euo pipefail
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      # Record the DEPLOYED service, and refuse to film the wrong build.
      #
      # This used to record a locally built container. That was defensible
      # ("the artifact that ships") but it meant the pixels on film never came
      # from the URL a judge opens, and the container had no Gemini identity,
      # so nothing on screen could prove the agent claims. Now the take is the
      # live service itself, gated first: the health endpoint must report this
      # exact release and the adk-agent close path, or there is no recording.
      - name: The live service is the release being filmed
        run: |
          set -euo pipefail
          HEALTH="$(curl -sf "${ARCHON_APP_URL}api/health")"
          echo "${HEALTH}"
          RELEASE="$(echo "${HEALTH}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("release") or "")')"
          CLOSE_PATH="$(echo "${HEALTH}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("close_path") or "")')"
          test "${RELEASE}" = "${ARCHON_RELEASE_SHA:0:7}" || {
            echo "::error::live release '${RELEASE}' is not '${ARCHON_RELEASE_SHA:0:7}'; deploy first, then record"; exit 1; }
          test "${CLOSE_PATH}" = "adk-agent" || {
            echo "::error::live close_path is '${CLOSE_PATH}', and the narration names the agent"; exit 1; }

          # Release coherence. The page can serve one build while showing a
          # close an EARLIER build produced, and a video that films that is a
          # video of two releases claiming to be one. Refuse rather than record.
          PRODUCER="$(curl -sf "${ARCHON_APP_URL}api/close/2026-07"             | python3 -c 'import json,sys; print((json.load(sys.stdin).get("source") or {}).get("release") or "")')"
          test "${PRODUCER}" = "${RELEASE}" || {
            echo "::error::the stored close was produced by '${PRODUCER}' and this page serves '${RELEASE}'."
            echo "::error::Trigger a close on this release before recording."
            exit 1; }
          # Buffered, not piped: `grep -q` closes the pipe on first match,
          # curl takes SIGPIPE (exit 23) and pipefail fails a preflight whose
          # every check had already passed. Same trap family as the CI tee.
          curl -sf "${ARCHON_APP_URL}" -o /tmp/page.html
          grep -q "closes the month while nobody is watching" /tmp/page.html

      - name: Record the judge's journey
        run: python3 video/capture_production.py
      - name: Compose and independently probe the final media
        run: python3 video/build-video.py
      - name: Validate the upload package
        run: |
          set -euo pipefail
          output="${ARCHON_VIDEO_ROOT}/output"
          # Set in video/build-video.py. Change both together or this fails.
          mp4="archon-demo.mp4"
          test -s "${output}/${mp4}"
          test -s "${output}/captions.en.srt"
          # The duration bound here is the FOURTH copy of one number: the
          # generator refuses to synthesise outside it, build-video.py refuses
          # to compose outside it, the offline contract test mirrors it, and
          # this jq refuses to upload outside it. Every one of them cost a
          # separate full cycle to discover, in that order. They are checked
          # against each other by
          # tests/unit/test_narration_contract.py::test_every_copy_of_the_cut_ceiling_agrees.
          #
          # sceneCount must equal the segments in video/narration.json. Ours is
          # 13: title, problem, value, surface, trigger, cloud, live, sponsor,
          # found, letters, gates, evidence, close. The first three are the
          # opening slides. The same list is asserted in
          # video/capture_production.py and pinned offline by
          # tests/unit/test_narration_contract.py, which also holds THIS number
          # to it -- it was 11 and stayed 11 when the deck was added, which
          # would have failed the package after a full recording rather than
          # before one.
          jq -e \
            --arg sha "${ARCHON_RELEASE_SHA}" \
            '.schemaVersion == "archon.submission-video-receipt/v1"
             and .releaseSha == $sha
             and .durationSeconds >= 90
             and .durationSeconds < 254
             and .width == 1920
             and .height == 1080
             and .sceneCount == 13
             and (.sha256 | test("^[a-f0-9]{64}$"))
             and .bytes > 1000000' \
            "${output}/video-receipt.json" >/dev/null
          if [[ -n "${ARCHON_HOSTED_RUN_ID}" ]]; then
            jq -e --argjson hosted "${ARCHON_HOSTED_RUN_ID}" '.hostedRunId == $hosted' \
              "${output}/video-receipt.json" >/dev/null
          fi
          if [[ -n "${ARCHON_GOVERNED_RUN_ID}" ]]; then
            jq -e --argjson governed "${ARCHON_GOVERNED_RUN_ID}" '.governedRunId == $governed' \
              "${output}/video-receipt.json" >/dev/null
          fi
          test "$(sha256sum "${output}/${mp4}" | awk '{print $1}')" = \
            "$(jq -er .sha256 "${output}/video-receipt.json")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archon-submission-video-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/archon-submission-video/output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove runner media
        if: always()
        run: |
          set -euo pipefail
          test "${ARCHON_VIDEO_ROOT}" = "${RUNNER_TEMP}/archon-submission-video"
          rm -rf -- "${ARCHON_VIDEO_ROOT}"
      - name: Remove the runner-only Google credential before source verification
        if: always()
        run: |
          set -euo pipefail
          case "${GOOGLE_GHA_CREDS_PATH:-}" in
            "${GITHUB_WORKSPACE}"/gha-creds-*.json)
              rm -f -- "${GOOGLE_GHA_CREDS_PATH}"
              ;;
            "") ;;
            *)
              echo "::error::Unexpected Google credential path"
              exit 1
              ;;
          esac
      - name: Require a clean source checkout
        if: always()
        run: test -z "$(git status --porcelain)"
